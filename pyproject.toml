[project]
name = "claudius"
version = "0.1.0"
description = "A Latin-only LLM pretrained from scratch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Corpus preparation and tokenizer training (CPU jobs).
data = [
    "datasets>=3.0",
    "tokenizers>=0.20",
    "transformers>=4.45",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
]
# Pretraining and evaluation (GPU jobs). Implies `data`.
train = [
    "claudius[data]",
    "torch>=2.4",
    "accelerate>=0.34",
    "trackio",
]
# The tutor web app: model inference, the LatinCy checker, a thin HTTP API.
web = [
    "transformers>=4.45",
    "huggingface_hub>=0.25",
    "torch>=2.4",
    "spacy>=3.7",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
dev = [
    "claudius[data]",
    "pytest>=8",
]

[project.scripts]
claudius = "claudius.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
