<!doctype html>
<html lang="la">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAVDIVS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Travertine, Pompeian red, bronze. Night: basalt and lamplight. */
  :root {
    --bg: #efe8da; --stone: #f7f2e7; --ink: #2a2118; --muted: #7d6f5c; --line: #d8cbb2;
    --red: #8e2a1f; --bronze: #9a7134; --you: #3b3024; --you-ink: #f4ecdc;
    --firm-bg: #f6e3dc; --firm-line: #b5543f; --firm-ink: #7a2115;
    --hint-bg: #f5ead0; --hint-line: #c49a4a; --hint-ink: #6b4f14;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --stone: #221d16; --ink: #ecdfc6; --muted: #a6957a; --line: #3b3226;
      --red: #d9735d; --bronze: #c9a063; --you: #3b3024; --you-ink: #f4ecdc;
      --firm-bg: #3a1f19; --firm-line: #8f4636; --firm-ink: #f2b8a7;
      --hint-bg: #33291a; --hint-line: #7d6230; --hint-ink: #edd49b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 500 17px/1.6 Cinzel, "Times New Roman", serif; letter-spacing: .04em;
    display: flex; justify-content: center;
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
                      radial-gradient(circle at 80% 90%, rgba(0,0,0,.04), transparent 45%);
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; }

  header { padding: 18px 16px 12px; text-align: center; border-bottom: 3px double var(--bronze); }
  header h1 { font: 700 30px/1 Cinzel, serif; letter-spacing: .22em; margin: 0; color: var(--red); }
  header .sub { font-size: 12px; letter-spacing: .3em; color: var(--muted); margin-top: 6px; }
  .bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .bar label { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  select, button {
    font: 600 13px/1 Cinzel, serif; letter-spacing: .12em; color: var(--ink);
    background: var(--stone); border: 1px solid var(--line); border-radius: 2px; padding: 8px 12px;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--bronze); }

  #log { flex: 1; overflow-y: auto; padding: 22px 16px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-direction: column; max-width: 86%; gap: 6px; }
  .row.student { align-self: flex-end; align-items: flex-end; }
  .row.teacher { align-self: flex-start; }
  .who { font-size: 11px; letter-spacing: .3em; color: var(--muted); }
  .bubble { padding: 11px 15px; background: var(--stone); border: 1px solid var(--line);
            border-left: 3px solid var(--red); border-radius: 2px; }
  .student .bubble { background: var(--you); color: var(--you-ink); border: 0; border-right: 3px solid var(--bronze); }
  .fix { border: 1px solid; border-radius: 2px; padding: 10px 13px; font-size: 16px; }
  .fix .label { display: block; font: 700 11px/1.4 Cinzel, serif; letter-spacing: .3em; margin-bottom: 4px; }
  .fix.firm { background: var(--firm-bg); border-color: var(--firm-line); color: var(--firm-ink); }
  .fix.hint { background: var(--hint-bg); border-color: var(--hint-line); color: var(--hint-ink); }
  .typing .bubble { color: var(--muted); }
  .typing .bubble::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0 } to { width: 1.2em } }

  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 460px; }
  .empty .big { font: 700 40px/1.1 Cinzel, serif; color: var(--red); letter-spacing: .2em; }
  .empty p { font-size: 15px; }
  .empty .try { color: var(--ink); }

  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 3px double var(--bronze); }
  #msg { flex: 1; font: 500 16px/1.4 Cinzel, serif; letter-spacing: .06em; padding: 11px 13px; border-radius: 2px;
         border: 1px solid var(--line); background: var(--stone); color: var(--ink); }
  #msg::placeholder { color: var(--muted); }
  #send { background: var(--red); color: #fbf3e4; border: 0; padding: 11px 18px; }
  #send:disabled { opacity: .5; cursor: default; }
  .error { color: var(--red); font-size: 13px; padding: 0 16px 8px; min-height: 1em; text-align: center; }
  @media (max-width: 520px) {
    header h1 { font-size: 24px; } .row { max-width: 94%; } body { font-size: 16px; }
  }
  .prog { height: 6px; background: var(--line); margin: 14px auto; max-width: 320px; border-radius: 1px; }
  #bar { height: 100%; width: 0; background: var(--bronze); transition: width .2s; }
  #mode[aria-pressed="true"] { background: var(--bronze); color: #fbf3e4; border-color: var(--bronze); }
  body.inscriptio .bubble, body.inscriptio .fix { letter-spacing: .1em; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CLAVDIVS</h1>
    <div class="sub">MAGISTER · LINGVAE · LATINAE</div>
    <div class="bar">
      <label for="level">GRADVS</label>
      <select id="level" aria-label="GRADVS">
        <option value="tiro">TIRO</option>
        <option value="medius">MEDIVS</option>
        <option value="peritus">PERITVS</option>
      </select>
      <button id="reset" type="button" title="NOVVS SERMO">NOVVS SERMO</button>
      <button id="mode" type="button" aria-pressed="false" title="LITTERAE VT IN LAPIDE: INTERPVNCTA, SINE SIGNIS HODIERNIS">INSCRIPTIO</button>
    </div>
  </header>
  <div id="log" aria-live="polite">
    <div class="empty" id="empty">
      <div class="big" id="loadtitle">SALVE!</div>
      <p id="loadmsg">CLAVDIVS IN HOC NAVIGATRO HABITAT: NIHIL PER INTERRETE MITTITVR.</p>
      <div class="prog"><div id="bar"></div></div>
      <p class="try" id="trymsg" hidden>TEMPTA: SALVE, MAGISTER! QVIS ES?</p>
    </div>
  </div>
  <div class="error" id="error"></div>
  <form id="form">
    <input id="msg" autocomplete="off" maxlength="300" placeholder="SCRIBE LATINE…" aria-label="SCRIBE LATINE">
    <button id="send" type="submit">MITTE</button>
  </form>
</div>
<script type="module">
  import { AutoTokenizer, AutoModelForCausalLM } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

  // Claudius in the browser: the model runs here (WebGPU, else WASM), nothing
  // is sent to a server. Without the Python checker, a correction comes only
  // from the model's own CORRIGE/RECTE mode, so it is always shown as a
  // question (NVM ERRAS?), never as a verdict.
  const REPO = "fbandov/claudius-latin-400m-chat";
  const $ = id => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("msg"), send = $("send"), level = $("level"), err = $("error");
  let tok, model, history = [];

  const norm = t => t.normalize("NFKD").replace(/[̀-ͯ]/g, "").toUpperCase()
                     .replace(/V/g, "U").replace(/J/g, "I").replace(/W/g, "UU").replace(/\s+/g, " ").trim();
  const roman = t => t.replace(/U/g, "V");
  const esc = t => t.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  // Inscription display (INSCRIPTIO): what a Roman stonecutter would have cut.
  // Words joined by interpuncts, no modern punctuation (Rome had no ? ! , ;
  // or quotes), digits as Roman numerals. Display only: the model, the history
  // and the corrections never see it.
  const NUMERALS = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  const toRoman = n => { let s = ""; for (const [v, r] of NUMERALS) while (n >= v) { s += r; n -= v; } return s; };
  const inscribe = t => t
    .replace(/\d+/g, d => (+d > 0 && +d < 4000) ? toRoman(+d) : d)
    .split("\n").map(line => line.replace(/[^A-Z\s]+/g, " ").trim().split(/\s+/).filter(Boolean).join("·\u200B")).join("\n");  // zero-width space: lines can wrap after a point
  let inscription = false;
  try { inscription = localStorage.getItem("claudius-inscriptio") === "1"; } catch (e) {}
  const show = t => inscription ? inscribe(t) : t;
  // Every piece of Latin on the page keeps its plain text, so the toggle can re-render it.
  const lat = t => `<span class="lat" data-raw="${esc(t)}">${esc(show(t))}</span>`;
  function setInscription(on) {
    inscription = on;
    try { localStorage.setItem("claudius-inscriptio", on ? "1" : "0"); } catch (e) {}
    document.body.classList.toggle("inscriptio", on);
    const b = document.getElementById("mode"); b.setAttribute("aria-pressed", String(on));
    document.querySelectorAll(".lat").forEach(e => { e.textContent = show(e.dataset.raw); });
  }

  const words = t => t.match(/[A-Z]+/g) || [];
  // Same guard as claudius.tutor.echoes: a closing question that only restates
  // the student's statement ("EGO CANEM HABEO." -> "TU CANEM HABES?") is resampled.
  const FUNC = new Set(["TUUS","TUA","TUUM","MEUS","MEA","MEUM","EGO","TU","EST","SUM","ET","NE","QUOQU","HABEO","HABES","ETIAM","NONNE","NUM"]);
  const content = t => new Set((t.match(/[A-Z]{3,}/g) || []).map(w => w.slice(0, 5)).filter(w => !FUNC.has(w)));
  function echoes(student, reply) {
    if (student.trim().endsWith("?")) return false;
    const q = reply.split(/(?<=[.!;])\s+/).pop();
    const cq = content(q), cs = content(student);
    if (!q.endsWith("?") || cq.size < 1) return false;
    return [...cq].filter(w => cs.has(w)).length / cq.size >= 0.75;
  }
  const system = lv => `GRADUS: ${lv.toUpperCase()}\nTU ES CLAUDIUS, MAGISTER LINGUAE LATINAE. DISCIPULUS EST ${lv.toUpperCase()}. ` +
                       "RESPONDE BREUITER ET SIMPLICITER. SI ERRAT, CORRIGE ET REGULAM EXPLICA. SEMPER INTERROGA.\n\n";

  // WebGPU is fast but its arithmetic is not equal everywhere: on one Mac the
  // 4-bit model on WebGPU produced digits and fused words (BONVS1, 1G?,
  // HODIEHERIS) that the same model on the CPU never does. So every GPU load is
  // checked with a correction whose answer is known; if it fails, the page falls
  // back to WASM (CPU), which is verified to match the reference model.
  const SELFTEST = ["CORRIGE: PUELLA ROSAM AMANT.\nRECTE:", "PUELLA ROSAM AMAT."];

  function progress(files) {
    return p => {
      if (p.status === "progress" && p.total) {
        files[p.file] = [p.loaded, p.total];
        const [l, t] = Object.values(files).reduce((a, [x, y]) => [a[0] + x, a[1] + y], [0, 0]);
        $("bar").style.width = (100 * l / t).toFixed(1) + "%";
        $("loadmsg").textContent = `CLAVDIVS ADVENIT… ${Math.round(l / 1e6)} / ${Math.round(t / 1e6)} MB`;
      }
    };
  }

  async function selftest() {
    const out = await complete(SELFTEST[0], {do_sample: false, repetition_penalty: 1.0, no_repeat_ngram_size: 0, max_new_tokens: 16});
    return out.trim() === SELFTEST[1];
  }

  async function load() {
    $("loadtitle").textContent = "EXSPECTA…";
    tok = await AutoTokenizer.from_pretrained(REPO);
    const gpu = !!navigator.gpu && !!(await navigator.gpu.requestAdapter().catch(() => null));
    let mode = "WASM";
    if (gpu) {
      try {
        model = await AutoModelForCausalLM.from_pretrained(REPO, {device: "webgpu", dtype: "q4", progress_callback: progress({})});
        if (await selftest()) mode = "WEBGPU";
        else { console.warn("[claudius] WebGPU self-test failed; using WASM"); await model.dispose?.(); model = null; }
      } catch (e) { console.warn("[claudius] WebGPU failed:", e); model = null; }
    }
    if (!model) {
      model = await AutoModelForCausalLM.from_pretrained(REPO, {device: "wasm", dtype: "q4", progress_callback: progress({})});
      if (!(await selftest())) console.warn("[claudius] WASM self-test failed");
    }
    $("loadtitle").textContent = "SALVE!";
    $("loadmsg").textContent = mode === "WEBGPU" ? "PARATVS (WEBGPU)." : "PARATVS (WASM: LENTIVS).";
    document.querySelector(".prog").hidden = true;
    $("trymsg").hidden = false;
    send.disabled = false;
    input.focus();
  }

  async function complete(prompt, opts) {
    const inputs = tok(prompt);
    const out = await model.generate({...inputs, eos_token_id: [tok.eos_token_id, 199], ...opts});
    const n = inputs.input_ids.dims[1];
    return tok.batch_decode(out.slice(null, [n, null]), {skip_special_tokens: true})[0];
  }

  async function correction(sentence) {
    const fixed = norm(await complete(`CORRIGE: ${sentence}\nRECTE:`,
      {do_sample: false, repetition_penalty: 1.0, no_repeat_ngram_size: 0, max_new_tokens: 64}));
    const a = words(sentence), b = words(fixed);
    if (a.length !== b.length) return null;
    const diff = a.map((w, i) => [w, b[i]]).filter(([x, y]) => x !== y);
    if (diff.length < 1 || diff.length > 2) return null;
    return {wrong: diff.map(d => d[0]).join(" "), right: diff.map(d => d[1]).join(" ")};
  }

  function row(cls, who, html) {
    $("empty")?.remove();
    const r = document.createElement("div");
    r.className = "row " + cls;
    r.innerHTML = `<span class="who">${who}</span>` + html;
    log.appendChild(r);
    log.scrollTop = log.scrollHeight;
    return r;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = norm(input.value);
    if (!text || send.disabled) return;
    err.textContent = ""; input.value = ""; send.disabled = true;
    history.push(["DISCIPULUS", text]);
    row("student", "TV", `<div class="bubble">${lat(roman(text))}</div>`);
    const typing = row("teacher typing", "CLAVDIVS", `<div class="bubble">SCRIBIT</div>`);
    try {
      const fix = await correction(text);
      const prefix = fix ? `NUM "${fix.right}" DICERE UOLUISTI?` : "";
      const turns = history.slice(-6).map(([r, t]) => `${r}: ${t}\n`).join("");
      let reply = "";
      for (let tries = 0; tries < 4; tries++) {
        reply = await complete(system(level.value) + turns + "MAGISTER:" + (prefix ? " " + prefix : ""),
          {do_sample: true, temperature: 0.5, top_p: 0.9, repetition_penalty: 1.15, no_repeat_ngram_size: 4, max_new_tokens: 60});
        reply = reply.split("\n")[0].trim();
        const q = reply.indexOf("?");
        if (q >= 0) reply = reply.slice(0, q + 1);
        if (!echoes(text, reply)) break;
      }
      typing.remove();
      history.push(["MAGISTER", (prefix ? prefix + " " : "") + reply]);
      const box = fix ? `<div class="fix hint"><span class="label">NVM ERRAS?</span>${lat(roman(prefix))}</div>` : "";
      row("teacher", "CLAVDIVS", box + (reply ? `<div class="bubble">${lat(roman(reply))}</div>` : ""));
    } catch (e2) {
      typing.remove(); history.pop();
      err.textContent = "CLAVDIVS RESPONDERE NON POTVIT (" + e2.message + "). ITERVM TEMPTA.";
    } finally {
      send.disabled = false; input.focus();
    }
  });

  document.getElementById("mode").addEventListener("click", () => setInscription(!inscription));
  setInscription(inscription);
  $("reset").addEventListener("click", () => {
    history = []; log.querySelectorAll(".row").forEach(r => r.remove()); err.textContent = ""; input.focus();
  });
  send.disabled = true;
  load().catch(e => { $("loadtitle").textContent = "EHEV!"; $("loadmsg").textContent = "CLAVDIVS VENIRE NON POTVIT: " + e.message; });
</script>
</body>
</html>
